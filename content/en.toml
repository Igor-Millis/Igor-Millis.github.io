description = "Why overdispersion in a Poisson GLM leads to the negative binomial: the Y|Z model with Z ~ Gamma, the iterated expectation E[E[Y|Z]], the law of total variance, the integral that yields the negative binomial, the NB2 GLM, estimation and coverage simulations."
