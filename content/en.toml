minutes = 30
abstract = "Write the count in two layers — a Gamma rate for each unit, then Poisson given the rate — and the iterated expectation, the law of total variance and one integral show where overdispersion comes from and why the answer is the negative binomial. Then a fit and a simulation measure the cost of ignoring it."

