  ["P4", "correspondências", "<strong>Correspondências entre anos</strong> (ex.: códigos de curso revisados em 2024), para que comparações só ocorram com compatibilidade verificada."],
  ["P5", "visões", "<strong>Visões analíticas</strong> sobre o núcleo, incluindo o Anexo I reconstruído como visão depois de provar I = II + III célula a célula."],
