s1_title = "Dado público, formato hostil"
s1_body = '''<p>As Sinopses do INEP são as estatísticas oficiais anuais da educação superior brasileira — mas chegam como centenas de abas de planilha por ano, com layouts que mudam entre edições. Responder “como evoluíram as matrículas no Espírito Santo?” exige abrir pastas de trabalho, achar a aba certa e torcer para as colunas significarem o mesmo que no ano anterior.</p>
<p><strong>Objetivo:</strong> uma ferramenta em que qualquer pessoa pergunta em português e recebe um número <strong>calculado, rastreável e honesto</strong> sobre o que a base não contém.</p>'''
s2_label = "02 · pipeline"
s2_title = "Sete camadas do ZIP à resposta"
s2_body = "Os arquivos originais nunca são alterados. Cada valor do núcleo guarda a aba e a célula da planilha do INEP de onde veio. Selecione uma etapa:"
stages = [
  ["P0", "staging", "<strong>Cópia fiel.</strong> O XML de cada aba é lido em streaming com lxml (sem Excel): uma tabela Parquet por aba e ano, todo valor guardado como texto bruto com a linha de origem."],
  ["P1", "anexos", "<strong>Mapeamento curado de cabeçalhos</strong> transforma colunas da planilha em dimensões explícitas nos anexos por curso, validado contra os arquivos originais."],
  ["P2", "núcleo", "<strong>Fatos em formato longo</strong> no DuckDB, com dimensões, status de qualidade e origem por célula para cada valor."],
  ["P3", "sinopse", "<strong>Tabelas da Sinopse</strong> (sexo, cor/raça, faixa etária, organização…) mapeadas por vocabulário e validadas — inclusive totais conferidos no XML original."],
  ["P4", "correspondências", "<strong>Correspondências entre anos</strong> (ex.: códigos de curso revisados em 2024), para que comparações só ocorram com compatibilidade verificada."],
  ["P5", "visões", "<strong>Visões analíticas</strong> sobre o núcleo, incluindo o Anexo I reconstruído como visão depois de provar I = II + III célula a célula."],
  ["P6", "marts", "<strong>Três marts compactos</strong> com regras de agregação explícitas (“somar só folhas”), validados contra os fatos. O motor lê apenas eles."],
]
s3_label = "03 · motor"
s3_title = "Pergunta → consulta → SQL"
s3_body = '''<p>Um interpretador por regras, com catálogo semântico, transforma a pergunta numa <code>Consulta</code> estruturada. Essa consulta em JSON é validada contra o catálogo e o banco e então compilada em <strong>SQL parametrizado</strong>, executado numa conexão <strong>somente leitura</strong>. Rankings, crescimento e participações são calculados depois, em Python.</p>
<p>Reproduza perguntas reais do gabarito do projeto:</p>'''
replay_head = "edudata › replay de consulta"
replay_cols = ["1 · consulta.json", "2 · sql (read_only)", "3 · resultado"]
replay_ok = "Executada em <b>{mart}</b> · parâmetros com <b>?</b> · células suspeitas sinalizadas, ausência ≠ zero."
replay_rank = "O ranking e o top 10 são calculados no código de análise, não no SQL."
replay_why_out_of_range = "Pede esclarecimento: a base cobre apenas 2017–2024. Nenhum número é inventado."
replay_why_not_published = "Pede esclarecimento: as Sinopses não publicam taxas de conclusão por coorte."
replay_note = "Consultas retiradas de tests/gold_interpretacoes.jsonl. SQL reproduzido a partir do planejador em motor/consultas.py — um replay, não um banco ao vivo."
s4_label = "04 · llm"
s4_title = "Onde um LLM local ajuda — e onde não"
s4_body = '''<p>Um modelo local (Ollama, em CPU) pode ajudar a interpretar perguntas que as regras não reconhecem. Ele segue o <strong>mesma estrutura de consulta em JSON</strong>: devolve nomes, nunca SQL nem números. A decisão de mantê-lo opcional veio de medi-lo em 40 perguntas parafraseadas e inéditas:</p>'''
s4_cols = ["interpretador", "paráfrases /24", "controle inédito /16", "total /40", "tempo médio"]
s4_cap = "* As regras foram ajustadas depois de ver as falhas nas paráfrases, então 24/24 não mede generalização; o conjunto de controle inédito mede. Fonte: _arquitetura/02_decisoes.md (D17)."
s4_after = '''<p><strong>Decisão:</strong> regras por padrão; modo híbrido com o modelo 7B como opção, com aviso obrigatório para conferir a interpretação. Nenhum modelo sozinho igualou as regras — o 7B errou muito menos que o 3B (27 × 21 de 40), então, quando o modelo é usado, a exatidão pesa mais que a latência.</p>'''
s5_label = "05 · qualidade"
s5_title = "Regras de honestidade, garantidas em código"
s5_body = '''<ul>
<li><strong>Nada é corrigido em silêncio.</strong> Inconsistências da publicação (ocorrências Q01–Q13) ficam como publicadas, recebem status <code>suspeito</code> e são citadas nas respostas.</li>
<li><strong>Ausência ≠ zero.</strong> Linhas ausentes nunca viram zero; participações sem numerador ficam indefinidas.</li>
<li><strong>Razões são razões de somas</strong> — nunca médias de razões.</li>
<li><strong>Segurança do SQL em camadas:</strong> conexão somente leitura, só SELECT/WITH, lista de tabelas autorizadas, sem acesso a arquivos, limite de 60 s e de 5.000 linhas, toda consulta registrada.</li>
<li><strong>Operações reversíveis:</strong> compactação do banco por cópia-validação-troca (5,11 → 4,48 GB), com equivalência provada nas 61 respostas do gabarito.</li>
</ul>'''
