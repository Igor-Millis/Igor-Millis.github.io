[work.credit]
title = "Credit Default API — Modelo de risco XGBoost servido com FastAPI"
description = "Previsão de inadimplência de cartão de crédito no dataset da UCI: quatro famílias de modelos, grid search, threshold ajustado para 0,24, SHAP, FastAPI com validação Pydantic, pytest e Docker."
name = "Credit Default API"
kicker = "machine learning · serving de modelos"
summary = "Estimar a probabilidade de um cliente de cartão ficar inadimplente no próximo mês, escolher o limiar de decisão de propósito e servir tudo como uma API REST validada."
tags = ["XGBoost", "scikit-learn", "SHAP", "FastAPI", "Pydantic", "Docker"]
meta = ["ROC AUC 0,777", "recall 0,601"]
spec = [
  ["dataset", "Default of Credit Card Clients (UCI)"],
  ["tarefa", "classificação binária · default no próximo mês"],
  ["modelo", "XGBoost (grid search) + threshold 0,24"],
  ["serving", "FastAPI · POST /predict · Docker"],
  ["interface", "cliente Streamlit via Docker Compose"],
  ["status", "roda localmente · sem deploy público ainda"],
]
stats = [
  ["30.000", "clientes · 23 preditoras"],
  ["22,1%", "de inadimplência (desbalanceamento moderado)"],
  ["0,777", "ROC AUC no teste separado"],
  ["60,1%", "dos inadimplentes identificados"],
]
s1_label = "01 · problema"
s1_title = "Acurácia é o alvo errado"
s1_body = '''<p>Com 77,9% dos clientes adimplentes, um modelo que prevê “não inadimplente” para todos já tem 78% de acurácia — e não serve para nada. Os custos dos dois erros não são simétricos: deixar passar um inadimplente costuma ser pior do que mandar um bom cliente para revisão.</p>
<p>Por isso o projeto avalia <strong>precision, recall, F1 e ROC AUC</strong>, mantém um conjunto de teste estratificado (6.000 clientes) intocado até o fim e trata o limiar de decisão como uma escolha de modelagem.</p>'''
s2_label = "02 · método"
s2_title = "Um pipeline, quatro famílias de modelos"
s2_body = '''<p>O pré-processamento fica dentro de um <code>Pipeline</code> do scikit-learn, para que treino e inferência apliquem as mesmas transformações: <code>StandardScaler</code> nos valores, <code>OneHotEncoder</code> em sexo, escolaridade e estado civil, e o histórico ordinal de pagamentos (<code>PAY_0…PAY_6</code>) mantido na escala original. Cada família foi treinada como baseline e com grid search.</p>'''
s2_cols = ["modelo", "variante", "acurácia", "precision", "recall", "F1", "ROC AUC"]
s2_cap = "Conjunto de teste, threshold 0,50. Árvore de Decisão e Random Forest têm apenas acurácia e AUC na fonte. Fonte: README.md, notebooks/09_model_selection.ipynb."
s3_label = "03 · threshold"
s3_title = "Mover o limiar é o ganho de verdade"
s3_body = '''<p>No corte padrão de 0,50, o grid search quase não mudou o XGBoost (AUC 0,773 → 0,777) e o recall ficou perto de 36%. A ordenação das probabilidades era boa; o gargalo era a <strong>regra de decisão</strong>. Arraste o threshold:</p>'''
th_head = "xgboost (grid search) · teste · grade de 0,05"
th_label = "threshold τ"
th_keys = ["precision", "recall", "F1", "c<sub>FN</sub>/c<sub>FP</sub> implícito"]
th_cap = "Curva: notebooks/09_model_selection.ipynb (teste, n = 6.000). O threshold operacional 0,24 foi escolhido maximizando o F1 na validação (F1 = 0,5405) em notebooks/010_model_validation.ipynb. Razão de custos implícita = (1 − τ)/τ, válida só se as probabilidades forem calibradas."
s3_after = '''<p>O modelo final usa <strong>τ = 0,24</strong>: passa a encontrar <strong>60,1%</strong> dos inadimplentes em vez de 35,6%, trocando precision (0,66 → 0,49) por recall — uma decisão de negócio explicitada. Por que 0,24 e o que isso implica está no artigo <a href="{note}">“Um threshold é uma decisão”</a>.</p>'''
cm_title = "Matriz de confusão final — teste, τ = 0,24"
cm_rows = ["real 0", "real 1"]
cm_cols = ["pred 0", "pred 1"]
cm_names = ["verd. neg.", "falso pos.", "falso neg.", "verd. pos."]
final_cols = ["métrica", "valor"]
final_rows = ["acurácia", "precision", "recall", "F1", "ROC AUC"]
s4_label = "04 · interpretabilidade"
s4_title = "O que move a previsão"
s4_body = "A análise SHAP e a importância de variáveis do modelo concordam: o histórico recente de pagamentos domina. Só o PAY_0 (status do mês mais recente) concentra cerca de 44% da importância."
s4_cap = "Importância de variáveis do XGBoost, top 10 (colunas one-hot com seu nível). Fonte: models/xgboost_tuned_feature_importance.csv."
best_params = "melhores hiperparâmetros · 72 combinações · CV ROC AUC 0,7853"
