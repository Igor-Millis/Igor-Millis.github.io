stages = [
  ["P0", "staging", "<strong>Cópia fiel.</strong> O XML de cada aba é lido em streaming com lxml (sem Excel): uma tabela Parquet por aba e ano, todo valor guardado como texto bruto com a linha de origem."],
  ["P1", "anexos", "<strong>Mapeamento curado de cabeçalhos</strong> transforma colunas da planilha em dimensões explícitas nos anexos por curso, validado contra os arquivos originais."],
  ["P2", "núcleo", "<strong>Fatos em formato longo</strong> no DuckDB, com dimensões, status de qualidade e origem por célula para cada valor."],
