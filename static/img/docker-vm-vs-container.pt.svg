<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>

  <!-- ===== VMs ===== -->
  <text x="220" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1d2b36">Máquinas Virtuais</text>
  <text x="220" y="58" text-anchor="middle" font-size="13" fill="#5b6b7a">"várias casas, cada uma com sua fundação"</text>

  <!-- 3 VMs -->
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="80" width="120" height="190" rx="10" fill="#fff8e1" stroke="#f0a500" stroke-width="1.5"/>
    <rect x="42" y="92" width="96" height="34" rx="6" fill="#ffffff" stroke="#2496ED"/><text x="90" y="114" fill="#1d2b36">App A</text>
    <rect x="42" y="132" width="96" height="34" rx="6" fill="#ffffff" stroke="#9aa5b1"/><text x="90" y="154" fill="#1d2b36">Bibliotecas</text>
    <rect x="42" y="172" width="96" height="86" rx="6" fill="#ffe0b2" stroke="#f0a500"/><text x="90" y="206" font-weight="700" fill="#8a5a00">SO completo</text><text x="90" y="226" fill="#8a5a00">+ kernel</text><text x="90" y="244" fill="#8a5a00">(GBs)</text>

    <rect x="160" y="80" width="120" height="190" rx="10" fill="#fff8e1" stroke="#f0a500" stroke-width="1.5"/>
    <rect x="172" y="92" width="96" height="34" rx="6" fill="#ffffff" stroke="#2496ED"/><text x="220" y="114" fill="#1d2b36">App B</text>
    <rect x="172" y="132" width="96" height="34" rx="6" fill="#ffffff" stroke="#9aa5b1"/><text x="220" y="154" fill="#1d2b36">Bibliotecas</text>
    <rect x="172" y="172" width="96" height="86" rx="6" fill="#ffe0b2" stroke="#f0a500"/><text x="220" y="206" font-weight="700" fill="#8a5a00">SO completo</text><text x="220" y="226" fill="#8a5a00">+ kernel</text><text x="220" y="244" fill="#8a5a00">(GBs)</text>

    <rect x="290" y="80" width="120" height="190" rx="10" fill="#fff8e1" stroke="#f0a500" stroke-width="1.5"/>
    <rect x="302" y="92" width="96" height="34" rx="6" fill="#ffffff" stroke="#2496ED"/><text x="350" y="114" fill="#1d2b36">App C</text>
    <rect x="302" y="132" width="96" height="34" rx="6" fill="#ffffff" stroke="#9aa5b1"/><text x="350" y="154" fill="#1d2b36">Bibliotecas</text>
    <rect x="302" y="172" width="96" height="86" rx="6" fill="#ffe0b2" stroke="#f0a500"/><text x="350" y="206" font-weight="700" fill="#8a5a00">SO completo</text><text x="350" y="226" fill="#8a5a00">+ kernel</text><text x="350" y="244" fill="#8a5a00">(GBs)</text>
  </g>

  <rect x="30" y="280" width="380" height="44" rx="8" fill="#ede7f6" stroke="#7e57c2"/>
  <text x="220" y="307" text-anchor="middle" font-size="15" font-weight="600" fill="#4527a0">Hypervisor (simula hardware)</text>
  <rect x="30" y="332" width="380" height="44" rx="8" fill="#eceff1" stroke="#78909c"/>
  <text x="220" y="359" text-anchor="middle" font-size="15" font-weight="600" fill="#37474f">Sistema operacional do hospedeiro</text>
  <rect x="30" y="384" width="380" height="44" rx="8" fill="#cfd8dc" stroke="#607d8b"/>
  <text x="220" y="411" text-anchor="middle" font-size="15" font-weight="600" fill="#263238">Hardware (CPU, memória, disco)</text>

  <!-- divisor -->
  <line x1="450" y1="30" x2="450" y2="430" stroke="#e1e6eb" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- ===== Containers ===== -->
  <text x="680" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#2496ED">Containers</text>
  <text x="680" y="58" text-anchor="middle" font-size="13" fill="#5b6b7a">"apartamentos num mesmo prédio"</text>

  <g font-size="13" text-anchor="middle">
    <rect x="490" y="176" width="120" height="94" rx="10" fill="#e3f2fd" stroke="#2496ED" stroke-width="1.5"/>
    <rect x="502" y="188" width="96" height="34" rx="6" fill="#ffffff" stroke="#2496ED"/><text x="550" y="210" fill="#1d2b36">App A</text>
    <rect x="502" y="228" width="96" height="34" rx="6" fill="#ffffff" stroke="#9aa5b1"/><text x="550" y="250" fill="#1d2b36">Bibliotecas</text>

    <rect x="620" y="176" width="120" height="94" rx="10" fill="#e3f2fd" stroke="#2496ED" stroke-width="1.5"/>
    <rect x="632" y="188" width="96" height="34" rx="6" fill="#ffffff" stroke="#2496ED"/><text x="680" y="210" fill="#1d2b36">App B</text>
    <rect x="632" y="228" width="96" height="34" rx="6" fill="#ffffff" stroke="#9aa5b1"/><text x="680" y="250" fill="#1d2b36">Bibliotecas</text>

    <rect x="750" y="176" width="120" height="94" rx="10" fill="#e3f2fd" stroke="#2496ED" stroke-width="1.5"/>
    <rect x="762" y="188" width="96" height="34" rx="6" fill="#ffffff" stroke="#2496ED"/><text x="810" y="210" fill="#1d2b36">App C</text>
    <rect x="762" y="228" width="96" height="34" rx="6" fill="#ffffff" stroke="#9aa5b1"/><text x="810" y="250" fill="#1d2b36">Bibliotecas</text>
  </g>
  <text x="680" y="120" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="600">sem SO próprio → leves (MBs)</text>
  <text x="680" y="142" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="600">e ligam em segundos</text>

  <rect x="490" y="280" width="380" height="44" rx="8" fill="#bbdefb" stroke="#2496ED"/>
  <text x="680" y="307" text-anchor="middle" font-size="15" font-weight="600" fill="#0d47a1">Docker Engine</text>
  <rect x="490" y="332" width="380" height="44" rx="8" fill="#eceff1" stroke="#78909c"/>
  <text x="680" y="359" text-anchor="middle" font-size="15" font-weight="600" fill="#37474f">SO do hospedeiro (kernel compartilhado)</text>
  <rect x="490" y="384" width="380" height="44" rx="8" fill="#cfd8dc" stroke="#607d8b"/>
  <text x="680" y="411" text-anchor="middle" font-size="15" font-weight="600" fill="#263238">Hardware (CPU, memória, disco)</text>
</svg>
