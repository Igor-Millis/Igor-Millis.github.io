<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2496ED"/>
    </marker>
  </defs>
  <rect width="900" height="340" fill="#ffffff"/>

  <!-- Navegador -->
  <rect x="20" y="110" width="180" height="110" rx="12" fill="#f4f6f8" stroke="#c9d1d9" stroke-width="1.5"/>
  <text x="110" y="148" text-anchor="middle" font-size="17" font-weight="700" fill="#1d2b36">🌐 Navegador</text>
  <text x="110" y="180" text-anchor="middle" font-size="13" font-family="Consolas, Menlo, monospace" fill="#1d2b36">localhost:8080</text>

  <line x1="205" y1="165" x2="318" y2="165" stroke="#2496ED" stroke-width="3" marker-end="url(#seta)"/>

  <!-- Host -->
  <rect x="250" y="30" width="630" height="280" rx="16" fill="#f4f6f8" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="270" y="60" font-size="16" font-weight="700" fill="#37474f">💻 Seu computador (o "prédio")</text>

  <!-- porta host -->
  <rect x="325" y="130" width="120" height="70" rx="10" fill="#fff8e1" stroke="#f0a500" stroke-width="2"/>
  <text x="385" y="160" text-anchor="middle" font-size="13" fill="#8a5a00">porta</text>
  <text x="385" y="184" text-anchor="middle" font-size="20" font-weight="700" fill="#8a5a00">8080</text>
  <text x="385" y="225" text-anchor="middle" font-size="12" fill="#5b6b7a">a "campainha</text>
  <text x="385" y="241" text-anchor="middle" font-size="12" fill="#5b6b7a">da portaria"</text>

  <line x1="450" y1="165" x2="583" y2="165" stroke="#2496ED" stroke-width="3" marker-end="url(#seta)"/>
  <text x="516" y="150" text-anchor="middle" font-size="15" font-weight="700" font-family="Consolas, Menlo, monospace" fill="#2496ED">-p 8080:80</text>

  <!-- container -->
  <rect x="590" y="85" width="270" height="170" rx="14" fill="#e3f2fd" stroke="#2496ED" stroke-width="2"/>
  <text x="725" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#0d47a1">📦 Container "meu-site"</text>
  <rect x="612" y="132" width="90" height="66" rx="10" fill="#ffffff" stroke="#2496ED" stroke-width="2"/>
  <text x="657" y="158" text-anchor="middle" font-size="13" fill="#0d47a1">porta</text>
  <text x="657" y="183" text-anchor="middle" font-size="20" font-weight="700" fill="#0d47a1">80</text>
  <rect x="722" y="132" width="118" height="66" rx="10" fill="#e8f5e9" stroke="#43a047"/>
  <text x="781" y="170" text-anchor="middle" font-size="15" font-weight="600" fill="#1b5e20">Nginx</text>
  <text x="725" y="232" text-anchor="middle" font-size="12" fill="#5b6b7a">por dentro, o app sempre usa a porta 80</text>
</svg>
