<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>

  <!-- Sem volume -->
  <text x="220" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#c0392b">Sem volume</text>
  <rect x="40" y="60" width="160" height="150" rx="12" fill="#e3f2fd" stroke="#2496ED" stroke-width="2"/>
  <text x="120" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">📦 Container</text>
  <rect x="58" y="104" width="124" height="88" rx="8" fill="#fff8e1" stroke="#f0a500"/>
  <text x="120" y="142" text-anchor="middle" font-size="14" fill="#8a5a00">🗄️ dados</text>
  <text x="120" y="164" text-anchor="middle" font-size="12" fill="#8a5a00">do banco</text>

  <line x1="208" y1="135" x2="268" y2="135" stroke="#5b6b7a" stroke-width="2" marker-end="url(#seta)"/>
  <text x="238" y="124" text-anchor="middle" font-size="12" font-family="Consolas, Menlo, monospace" fill="#5b6b7a">rm</text>

  <rect x="276" y="60" width="160" height="150" rx="12" fill="#fafafa" stroke="#c9d1d9" stroke-dasharray="6 5"/>
  <text x="356" y="130" text-anchor="middle" font-size="30">🗑️</text>
  <text x="356" y="165" text-anchor="middle" font-size="13" font-weight="600" fill="#c0392b">dados perdidos</text>

  <text x="238" y="250" text-anchor="middle" font-size="13" fill="#5b6b7a">"quarto de hotel": no check-out,</text>
  <text x="238" y="270" text-anchor="middle" font-size="13" fill="#5b6b7a">a camareira limpa tudo</text>

  <line x1="470" y1="30" x2="470" y2="350" stroke="#e1e6eb" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Com volume -->
  <text x="685" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#2e7d32">Com volume</text>

  <rect x="505" y="60" width="150" height="90" rx="12" fill="#e3f2fd" stroke="#2496ED" stroke-width="2"/>
  <text x="580" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">📦 Container v1</text>
  <text x="580" y="118" text-anchor="middle" font-size="12" fill="#c0392b">(apagado ✘)</text>

  <rect x="715" y="60" width="150" height="90" rx="12" fill="#e3f2fd" stroke="#2496ED" stroke-width="2"/>
  <text x="790" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">📦 Container v2</text>
  <text x="790" y="118" text-anchor="middle" font-size="12" fill="#2e7d32">(novinho ✔)</text>

  <line x1="580" y1="152" x2="650" y2="222" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="790" y1="152" x2="720" y2="222" stroke="#43a047" stroke-width="2.5"/>

  <rect x="580" y="225" width="210" height="90" rx="12" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="685" y="258" text-anchor="middle" font-size="15" font-weight="700" fill="#1b5e20">🔐 Volume "dados-banco"</text>
  <text x="685" y="282" text-anchor="middle" font-size="13" fill="#1b5e20">fica FORA do container</text>
  <text x="685" y="302" text-anchor="middle" font-size="13" fill="#1b5e20">os dados sobrevivem ✔</text>

  <text x="685" y="345" text-anchor="middle" font-size="13" fill="#5b6b7a">"cofre do hotel": troque de quarto quantas vezes quiser</text>
</svg>
